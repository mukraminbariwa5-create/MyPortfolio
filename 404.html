<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signal lost — MUKRAMIN.DEV</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Manrope:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0B0A0F;--ink:#E9DDE4;--muted:#A99CA6;--acc:#22E5FF}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif;overflow:hidden;
  background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.02) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,rgba(34,229,255,.08),transparent 60%)}
main{text-align:center;max-width:560px;display:flex;flex-direction:column;align-items:center;gap:18px}
.code{font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:clamp(110px,28vw,200px);line-height:.9;letter-spacing:.04em;color:#BFEAF2;position:relative;animation:glitch 3.5s infinite}
.code::before,.code::after{content:"404";position:absolute;inset:0;mix-blend-mode:screen;opacity:.7}
.code::before{color:#22E5FF;transform:translate(-3px,0);clip-path:inset(0 0 55% 0)}
.code::after{color:#7B4DFF;transform:translate(3px,0);clip-path:inset(55% 0 0 0)}
@keyframes glitch{0%,92%,100%{transform:none}93%{transform:translateX(-4px) skewX(6deg)}95%{transform:translateX(3px) skewX(-4deg)}97%{transform:none}}
.tag{font-family:'Chakra Petch',sans-serif;font-size:12px;letter-spacing:.32em;color:var(--acc)}
h1{margin:0;font-family:'Chakra Petch',sans-serif;font-size:24px;letter-spacing:.08em}
p{margin:0;color:var(--muted);line-height:1.7}
a{display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:0 24px;background:var(--acc);color:#021014;text-decoration:none;font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:13px;letter-spacing:.18em;border-radius:4px;box-shadow:0 0 24px rgba(34,229,255,.45)}
a:focus-visible{outline:2px solid #fff;outline-offset:3px}
@media (prefers-reduced-motion:reduce){.code{animation:none}}
</style>
</head>
<body>
<main>
  <div class="code" aria-hidden="true">404</div>
  <span class="tag">// SIGNAL LOST</span>
  <h1>This page doesn't exist</h1>
  <p>The link may be broken or the page was moved. Head back to the portfolio to see my projects and how to reach me.</p>
  <a href="/">BACK TO MUKRAMIN.DEV →</a>
</main>
</body>
</html>
